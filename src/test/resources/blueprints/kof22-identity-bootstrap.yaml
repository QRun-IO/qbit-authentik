# Test fixture: the kof22 identity bootstrap blueprint (DESIGN.md section 4.3),
# in the shape proposed for cluster-gitops. Identity objects are
# `state: created`: created when missing, never updated, never given members.
version: 1
metadata:
  name: kof22-identity-bootstrap
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Apply the infrastructure blueprint first (it owns the recovery email stage
  # referenced below). On an empty instance this is what makes the bootstrap
  # apply cleanly (contract test h).
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: kof22-oauth2-apps
      required: true

  # The role the qbit service account runs as. It is the qbit's own
  # infrastructure, not identity data, so it is `present`: attrs carry ONLY
  # `permissions` (global permissions; a blueprint-only RoleSerializer field),
  # which are assigned additively on every apply, so a permission removed in
  # the UI comes back within the hour and nothing granted elsewhere is taken
  # away. No users, no groups. Phase 0/1 = read-only; later phases append here.
  # Note: matching is by codename, so view_group also grants Django's unused
  # auth.view_group (harmless).
  - model: authentik_rbac.role
    state: present
    id: qqq-role
    identifiers:
      name: qqq-kof22-admin-idadmin
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.view_group
        - authentik_core.view_application
        - authentik_core.view_authenticatedsession
        - authentik_rbac.view_role
        - authentik_policies.view_policybinding
        - authentik_events.view_event
        - authentik_events.add_event
        - authentik_blueprints.view_blueprintinstance

        # v1 write permissions (qbit-authentik DESIGN.md 5.1): never enable_group_superuser, view_token_key, impersonate, delete_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.reset_user_password
        - authentik_core.add_group
        - authentik_core.change_group
        - authentik_core.add_user_to_group
        - authentik_core.remove_user_from_group
        - authentik_core.view_token
        - authentik_core.delete_token
        # QQQ access tokens (qbit-authentik DESIGN.md 13, owner decisions
        # 2026-10-13). Guardrails, because token permissions are model-wide:
        # - view_token_key is NOT granted. add_token IS granted, and is safe: for a
        #   non-superuser, POST /core/tokens/ always creates the token for the
        #   CALLER (TokenViewSet.perform_create), so it can never mint a token for
        #   someone else. Authentik needs it for POST /core/users/service_account/
        #   (add_user + add_token) and for POST .../set_key/ (POST object
        #   permission = add_token, plus set_token_key). Verified on 2026.8.3.
        #   People's tokens are created AS THAT PERSON through the
        #   qqq-kof22-token-broker exchange (kof22-qqq-tokens.yaml), whose deny
        #   policy refuses superusers, authentik Admins, identity-admins,
        #   qqq.io/protected and this service account.
        # - change_token extends expiry; every PATCH sends intent, user and
        #   expires (Authentik's serializer defaults would otherwise turn an app
        #   password into an API token or move it to this account), and the qbit
        #   re-reads the token afterwards.
        # - set_token_key rotates SERVICE-ACCOUNT app passwords only; the qbit
        #   refuses protected owners before the call, and the
        #   qqq-kof22-token-alarm rule (kof22-qqq-tokens.yaml) notifies
        #   identity-admins if this account ever touches a protected user's token.
        - authentik_core.add_token
        - authentik_core.change_token
        - authentik_core.set_token_key
        - authentik_core.delete_authenticatedsession
        - authentik_stages_authenticator_totp.view_totpdevice
        - authentik_stages_authenticator_totp.delete_totpdevice
        - authentik_stages_authenticator_static.view_staticdevice
        - authentik_stages_authenticator_static.delete_staticdevice
        - authentik_stages_authenticator_webauthn.view_webauthndevice
        - authentik_stages_authenticator_webauthn.delete_webauthndevice
        - authentik_stages_authenticator_email.view_emaildevice
        - authentik_stages_authenticator_email.delete_emaildevice
        - authentik_stages_authenticator_sms.view_smsdevice
        - authentik_stages_authenticator_sms.delete_smsdevice
        - authentik_stages_authenticator_duo.view_duodevice
        - authentik_stages_authenticator_duo.delete_duodevice

  # The qbit service account. Its API token is minted once by hand (never here).
  - model: authentik_core.user
    state: created
    id: qqq-sa
    identifiers:
      username: qqq-kof22-admin-idadmin
    attrs:
      name: QQQ kof22 Admin identity service
      type: service_account
      path: service-accounts/qqq
      roles:
        - !KeyOf qqq-role
      attributes:
        qqq.io/protected: true

  # Object permission on a stage the infrastructure blueprint owns: the bare
  # `created` entry is skipped (the stage exists), but its permissions are
  # still applied, additively, on every run.
  - model: authentik_stages_email.emailstage
    state: created
    identifiers:
      name: kof22-recovery-email
    permissions:
      - role: !KeyOf qqq-role
        permission: authentik_stages_email.view_emailstage

  # Seed groups: created once, then plain data. No users, no member lists.
  - model: authentik_core.group
    state: created
    identifiers:
      name: identity-admins
    attrs:
      attributes:
        qqq.io/permissions: ["authentik.*"]
        qqq.io/app-access: ["kof22-website-prod"]
  - model: authentik_core.group
    state: created
    identifiers:
      name: kof22-admins
  - model: authentik_core.group
    state: created
    identifiers:
      name: kof-website-publishers
  # No qqq.io/app-access yet: drafters sign in to the admin only once the owner
  # decides to set that one attribute (DESIGN.md section 11.2 item 6).
  - model: authentik_core.group
    state: created
    identifiers:
      name: kof-website-drafters

  # Break-glass admin: a superuser the qbit cannot touch. Password set once by
  # hand (1Password); recovery through `ak create_recovery_key`.
  - model: authentik_core.user
    state: created
    identifiers:
      username: kof22-breakglass
    attrs:
      name: Break-glass admin
      type: internal
      path: users/breakglass
      groups:
        - !Find [authentik_core.group, [name, "authentik Admins"]]
      attributes:
        qqq.io/protected: true
