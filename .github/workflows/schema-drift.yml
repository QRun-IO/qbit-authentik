name: authentik-schema-drift
'on':
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch:
    inputs:
      version:
        description: Authentik version (e.g. 2026.10.0); empty = latest release
        required: false
permissions:
  contents: read
jobs:
  drift:
    uses: QRun-IO/qqq-orb/.github/workflows/qbit-schema-drift.yml@1c389210e6dfda1630d053c07ae4dae523dd5576
    with:
      version: ${{ inputs.version || '' }}
