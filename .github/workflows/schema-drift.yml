name: authentik-schema-drift
'on':
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch:
    inputs:
      version:
        description: Authentik version (e.g. 2026.10.0); empty = latest release
        required: false
permissions:
  contents: read
jobs:
  drift:
    uses: QRun-IO/qqq-orb/.github/workflows/qbit-schema-drift.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
    with:
      version: ${{ inputs.version || '' }}
