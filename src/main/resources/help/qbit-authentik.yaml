- key: process:authentikTokenReminders;slot:help
  summary: 'Check approaching token expiries and issue the configured reminders.'
  content: |
    This background action checks tokens approaching their expiry and records reminder timing in **{{label:authentik_token_scope}}**. Use it to understand when owners were warned to renew or replace credentials. Reminders do not extend expiry or rotate a key automatically. Review **Tokens** for the current expiry, then use **{{label:authentikExtendToken}}**, **Rotate Token** or **Revoke Token** as appropriate for the credential.
- key: process:authentikCreateToken;slot:help
  summary: 'Create a personal access token with an expiry and optional access restrictions.'
  content: |
    Use **Create Token** to create an app-password token for your own account. Review the expiry and any available scope restrictions before submitting. Scopes can narrow your permissions but cannot grant new access. The credential is shown once after creation; keep it in your intended credential store. The **Tokens** list and **{{label:authentik_token_scope}}** retain metadata rather than a recoverable copy of that credential.
- key: process:authentikRotateToken;slot:help
  summary: 'Replace a token’s credential and invalidate the previous credential.'
  content: |
    Use **Rotate Token** when a credential needs replacement. Review the selected token and its ownership before continuing. Supported app-password tokens can be rotated; protected accounts require management in Authentik. Rotation invalidates the old credential, so update the consumers that use it. The new credential is shown once. Review **Tokens** and the recorded scope after completion.
- key: process:authentikRevokeToken;slot:help
  summary: 'Invalidate a selected token so it can no longer authenticate.'
  content: |
    Use **Revoke Token** when access is no longer needed or a token should stop working. Review the identifier and owner before submitting because any consumer relying on that token will lose access. Revocation also removes its local scope metadata. It does not delete the owner’s account. Review the resulting **Tokens** list to confirm the selected token is no longer available.
- key: process:authentikExtendToken;slot:help
  summary: 'Update the expiry of an eligible app-password token.'
  content: |
    Use **{{label:authentikExtendToken}}** when an existing eligible credential should remain valid for a longer allowed period. Review the owner and requested expiry before submitting. The action is limited to supported app-password tokens and permitted ownership; protected accounts are managed in Authentik. Extending resets expiry reminders but does not rotate the credential. Use **Rotate Token** when you need a replacement key.
- key: process:authentikCreateServiceAccount;slot:help
  summary: 'Create a service account with checked group access and an expiring app password.'
  content: |
    Use **Create Service Account** for an integration that needs its own identity. Review the account name, requested groups and expiry before proceeding. Group checks and protection rules still apply. The account receives an app-password credential that is shown once, so store it for the intended integration. Inspect the resulting account and **Tokens** after creation, and use **Rotate Token** for later credential replacement.
- key: widget:authentikAccessTokens;slot:label
  summary: 'Access tokens and their ownership, expiry and available management actions.'

- key: table:authentik_invitation;slot:help
  summary: Review enrollment invitations and their expiry dates in Authentik.
  content: |
    Use **{{label:authentik_invitation}}** to review invitations when your host has configured an enrollment flow. Check the email address and expiry before following up with someone. Use **{{label:authentikCancelInvitation}}** to withdraw an invitation.

    **How rows get created:** **{{label:authentikInviteUser}}** creates a single-use invitation in Authentik and requests its delivery by email. You read invitations live from Authentik. An empty list means no invitations match your query.
- key: table:authentik_invitation;field:name
  summary: The invitation name recorded in Authentik.
- key: table:authentik_invitation;field:email
  summary: The email address supplied for the invited person.
- key: table:authentik_invitation;field:singleUse
  summary: Whether the invitation can be redeemed only once.
- key: table:authentik_invitation;field:expires
  summary: When the invitation stops being valid.
- key: table:authentik_invitation;field:flowSlug
  summary: The enrollment flow used by this invitation.
- key: table:authentik_invitation;field:createdBy
  summary: The username Authentik records as the invitation creator.
- key: process:authentikInviteUser;slot:help
  summary: Invite a new person to enroll through Authentik by email.
  content: |
    Enter the person's email, an optional full name and a reason. You need permission to manage users, writes must be enabled, and your host must configure an enrollment flow. The email must not already belong to an existing user.

    Review the invitation before continuing. Authentik creates a single-use invitation that expires after seven days and sends the email. You can inspect it in **{{label:authentik_invitation}}** or withdraw it with **{{label:authentikCancelInvitation}}**.
- key: process:authentikCancelInvitation;slot:help
  summary: Withdraw an invitation so it can no longer be used to enroll.
  content: |
    Select the invitation and give a reason. Review your selection before continuing. You need permission to manage users and writes must be enabled.

    This action deletes the invitation in Authentik. An invitation that is already absent needs no change. Cancelling an invitation does not delete an account that has already enrolled.
- key: process:authentikDeleteUser;slot:help
  summary: Permanently delete an eligible account from Authentik.
  content: |
    Use **{{label:authentikDeactivateUser}}** if you want to keep the account and its history. Deletion is permanent and requires the host to enable deletion as well as user management and writes.

    Give a reason and type the username to confirm, then check **Review** before continuing. You cannot delete protected accounts, your own account or the last identity administrator. You need permission to manage users.
- key: process:authentikDeleteGroup;slot:help
  summary: Permanently delete an empty group and the access it grants.
  content: |
    Remove the group's members and child groups first. Deletion removes the group with its permissions, application access and policy. You need permission to manage groups, and your host must enable deletion, group management and writes.

    Give a reason and type the group name to confirm. Check **Review** before continuing. Superuser groups and changes that would remove the last identity administrator are refused.
- key: possibleValueSource:authentik_user;slot:help
  summary: Choose an Authentik user from the accounts visible to you.
- key: possibleValueSource:authentik_group;slot:help
  summary: Choose an Authentik group for the membership action.
